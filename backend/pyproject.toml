[project]
name = "backend"
version = "0.1.0"
description = "FastAPI monolith template"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.41",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "email-validator>=2.3",
    "pyjwt[crypto]>=2.11",
    "argon2-cffi>=25.1",
    "redis>=7.3",
    "httpx>=0.28",
    "boto3>=1.42",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.14",
    "mypy>=1.18",
    "boto3-stubs[s3]>=1.42",
    "import-linter>=2.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PIE", "PT", "RET",
    "SIM", "ARG", "ERA", "PL", "RUF", "S", "ASYNC", "TID", "PERF", "FAST",
]
ignore = [
    "PLR0913",  # services and factories take many keyword-only arguments on purpose
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Fakes implement protocols, so they keep parameters they do not use.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002"]
# FastAPI calls endpoints with keyword arguments; many parameters is how DI looks there.
"app/api/**" = ["PLR0917"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
    "fastapi.Cookie",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# Architecture rules, checked by `lint-imports` in `make lint` and CI.
# What each one means and what to do when it fails: docs/backend/architecture.md.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entrypoints > api > infra > service > db > domain > core"
type = "layers"
layers = [
    "app.main | app.worker | app.cli",
    "app.api",
    # Adapters sit above the service layer: they implement its ports (app/service/ports.py),
    # so they may import them, and the service layer can never import an adapter.
    "app.infra",
    "app.service",
    "app.db",
    "app.domain",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "Domain is plain Python: no web framework, ORM, validation or network libraries"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "pydantic", "redis", "boto3", "botocore", "httpx",
]

[[tool.importlinter.contracts]]
name = "Services know nothing about HTTP"
type = "forbidden"
source_modules = ["app.service"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Endpoints never touch ORM models, repositories or SQL directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.db.models", "app.db.repositories", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Zones inside a layer never import each other in a cycle"
type = "acyclic_siblings"
ancestors = ["app.api.v1", "app.service", "app.domain", "app.db", "app.infra"]
depth = 0

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: needs Postgres, Redis and S3 (RustFS) from docker-compose.test.yml"]
filterwarnings = ["error::DeprecationWarning:app.*"]
