# Fly.io deployment. Secrets (DATABASE_URL, REDIS_URL, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY,
# CSRF_HMAC_KEY, STORAGE_*) go to `fly secrets set`, never into this file.

app = 'template-backend'
primary_region = 'fra'

[build]

[env]
  APP_STAGE = 'prod'
  LOG_JSON = 'true'
  COOKIE_SECURE = 'true'

# Runs once per release, before new machines start: migrations never race.
[deploy]
  release_command = 'alembic upgrade head'

[processes]
  app = 'uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips * --no-access-log'
  worker = 'python -m app.worker'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/api/health'
    timeout = '2s'

[[vm]]
  memory = '512mb'
  cpus = 1
  processes = ['app', 'worker']
