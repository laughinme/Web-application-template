# Full local stack: `make up`, then open http://localhost (SPA + API behind nginx).
# The API image is shared by three services: migrate (one-shot), backend and worker.
name: monolith-template

x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    APP_STAGE: dev
    DATABASE_URL: postgresql+asyncpg://postgres:secret@db:5432/templatepg
    REDIS_URL: redis://redis:6379/0
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public_key.pem
    STORAGE_ENDPOINT_INTERNAL: http://s3:9000
    STORAGE_ENDPOINT_PUBLIC: http://localhost
    STORAGE_ACCESS_KEY: rustfsadmin
    STORAGE_SECRET_KEY: rustfsadmin
    STORAGE_AUTO_CREATE_BUCKETS: "true"
    COOKIE_SECURE: "false"
  volumes:
    - ./backend/secrets:/app/secrets:ro
  restart: unless-stopped

services:
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - s3
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: templatepg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d templatepg"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  s3_data:
